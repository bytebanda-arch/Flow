name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: unzip -q flow.zip
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: gradle -p Flow assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Flow APK ${{ github.run_number }}
          files: Flow/app/build/outputs/apk/debug/app-debug.apk
